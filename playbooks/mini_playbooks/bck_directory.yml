- name: Tworzenie backupu katalogu
  hosts: all
  become: yes
  
  vars:
    users:
      app1: developer1
      app2: developer2
      app3: developer3
      db1: dbuser

  tasks:
    - name: Utwórz kopię zapasową katalogu
      ansible.builtin.copy:
        src: /home/{{ users[inventory_hostname] }}/Katalog/
        dest: /home/{{ users[inventory_hostname] }}/Katalog_bck
        remote_src: yes
